<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f6fd6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold">SAFRDO — Control Unit Internal Structure</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#555">Analog of H&amp;H Fig. 7.28: an FSM emits the mux selects / enables; a sub-decoder generates the join cursor</text>

  <!-- dashed enclosure (the whole control unit) -->
  <rect x="40" y="80" width="700" height="470" rx="10" fill="none" stroke="#1f6fd6" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="56" y="102" font-size="12" font-weight="bold" fill="#13518f">CONTROL UNIT  (safrdo_controller)</text>

  <!-- Instruction decode -->
  <rect x="70" y="150" width="150" height="120" rx="6" fill="#f6f6f6" stroke="#222" stroke-width="1.5"/>
  <text x="145" y="178" text-anchor="middle" font-size="12" font-weight="bold">Instruction</text>
  <text x="145" y="194" text-anchor="middle" font-size="12" font-weight="bold">Decode</text>
  <text x="145" y="216" text-anchor="middle" font-size="9.5" fill="#555">imm   = [15:8]</text>
  <text x="145" y="232" text-anchor="middle" font-size="9.5" fill="#555">mask  = [5:2]</text>
  <text x="145" y="248" text-anchor="middle" font-size="9.5" fill="#555">opcode= [1:0]</text>

  <line x1="14" y1="210" x2="70" y2="210" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="12" y="204" text-anchor="end" font-size="10.5" fill="#13518f">instruction[15:0]</text>

  <!-- imm/mask out to datapath -->
  <line x1="145" y1="270" x2="145" y2="330" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="150" y="312" font-size="9.5" fill="#13518f">imm, mask  -&gt;  datapath (aligner / array)</text>

  <!-- Main Controller FSM -->
  <rect x="300" y="130" width="230" height="220" rx="8" fill="#eaf2fd" stroke="#1f6fd6" stroke-width="2"/>
  <text x="415" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#13518f">Main Controller</text>
  <text x="415" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#13518f">(FSM)</text>
  <text x="415" y="268" text-anchor="middle" font-size="9.5" fill="#13518f">IDLE / LATCH / LOAD_B</text>
  <text x="415" y="282" text-anchor="middle" font-size="9.5" fill="#13518f">STREAM_A / FLUSH</text>
  <text x="415" y="296" text-anchor="middle" font-size="9.5" fill="#13518f">DRAIN_JOIN / DONE</text>

  <!-- opcode into FSM -->
  <line x1="220" y1="200" x2="300" y2="200" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="258" y="194" text-anchor="middle" font-size="9.5" fill="#13518f">opcode[1:0]</text>
  <!-- start + counts into FSM -->
  <line x1="220" y1="300" x2="300" y2="300" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="9.5" fill="#13518f">cpu_start</text>
  <line x1="415" y1="130" x2="415" y2="92" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)" transform="rotate(180 415 111)"/>
  <text x="415" y="120" text-anchor="middle" font-size="9.5" fill="#13518f">num_a_rows / num_b_rows</text>

  <!-- output groups (right) -->
  <!-- Multiplexer selects -->
  <line x1="530" y1="165" x2="600" y2="165" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="169" font-size="10.5" fill="#13518f">sel_data_A</text>
  <line x1="530" y1="188" x2="600" y2="188" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="192" font-size="10.5" fill="#13518f">out_sel[1:0]</text>
  <path d="M690,158 q10,0 10,12 v8 q0,12 10,12 q-10,0 -10,12 v8 q0,12 -10,12" fill="none" stroke="#999"/>
  <text x="712" y="194" font-size="10" fill="#666" font-style="italic">Multiplexer</text>
  <text x="712" y="207" font-size="10" fill="#666" font-style="italic">selects</text>

  <!-- Register enables -->
  <line x1="530" y1="230" x2="600" y2="230" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="234" font-size="10.5" fill="#13518f">load_en</text>
  <line x1="530" y1="252" x2="600" y2="252" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="256" font-size="10.5" fill="#13518f">valid_in</text>
  <line x1="530" y1="274" x2="600" y2="274" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="278" font-size="10.5" fill="#13518f">join_clear, join_drain_en</text>
  <line x1="530" y1="296" x2="600" y2="296" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="300" font-size="10.5" fill="#13518f">done_signal</text>
  <path d="M760,223 q10,0 10,12 v14 q0,12 10,12 q-10,0 -10,12 v14 q0,12 -10,12" fill="none" stroke="#999"/>
  <text x="782" y="262" font-size="10" fill="#666" font-style="italic">Register</text>
  <text x="782" y="275" font-size="10" fill="#666" font-style="italic">enables</text>

  <!-- accum_mode -->
  <line x1="530" y1="325" x2="600" y2="325" stroke="#1f6fd6" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="606" y="329" font-size="10.5" fill="#13518f">accum_mode</text>

  <!-- down to Join Cursor Generator (analog of ALU Decoder) -->
  <line x1="415" y1="350" x2="415" y2="410" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="423" y="384" font-size="9.5" fill="#13518f">DRAIN_JOIN phase</text>

  <rect x="300" y="410" width="230" height="100" rx="8" fill="#eef7ee" stroke="#2f7d32" stroke-width="2"/>
  <text x="415" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5a22">Join Cursor Generator</text>
  <text x="415" y="468" text-anchor="middle" font-size="9.5" fill="#1f5a22">sweeps b_sel x p_sel,</text>
  <text x="415" y="482" text-anchor="middle" font-size="9.5" fill="#1f5a22">bounded by num_a_rows / num_b_rows</text>
  <text x="415" y="498" text-anchor="middle" font-size="9.5" fill="#1f5a22">(analog of the ALU Decoder)</text>

  <line x1="530" y1="460" x2="640" y2="460" stroke="#1f6fd6" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="646" y="464" font-size="10.5" fill="#13518f">b_sel, p_sel, n_a  -&gt;  join_collector</text>

  <!-- caption -->
  <text x="60" y="578" font-size="11" fill="#777">The FSM drives every datapath mux/enable; the cursor generator (bounded to real rows) feeds the join collector — exactly the FSM + sub-decoder split of H&amp;H Fig. 7.28.</text>
</svg>
